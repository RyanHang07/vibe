# E2B sandbox template config.
#
# MEMORY IS LOAD-BEARING.
#
# The default sandbox has ~976 MB. Turbopack building a Next 16 app with 318
# packages does not fit: the build printed its banner, reached "Creating an
# optimized production build", and was killed at 8 seconds with `exit -1` and
# no error output at all.
#
# That silence is the signature. A process that fails explains itself;
# a process that is killed cannot. Turbopack is loud when it fails — the
# symlink panic produced a wall of text and a bug-report URL — so the absence
# of any message was the evidence.
#
# 2 GB is a starting point, not a measured requirement. If the bundle step
# still dies silently, raise it; `npm run doctor` answers in 15 seconds for
# no tokens.
#
# NOTE ON COST: eval runs create one sandbox per case, so sandbox size
# multiplies across a batch. Worth checking E2B's pricing before raising this
# further, and worth remembering that typecheck — the more informative of the
# two signals — passes comfortably at the default size.

team_id = "d39aecf9-2ef5-4093-910e-e74e22b525e2"
start_cmd = "/compile_page.sh"
dockerfile = "e2b.Dockerfile"

# Updated from vibe-nextjs-ryan-test-2 / xpse44ch2d7aq8091vv3, which this file
# still named long after the template was rebuilt. A config that points at a
# retired template is the kind of thing that sends someone debugging the wrong
# sandbox.
template_name = "vibe-nextjs-16"
template_id = "mxamtmd9qj4rtpavlkdd"

# MEMORY AND CPU ARE NOT SET HERE. They are ignored in this file.
#
# `memory_mb = 2048` was added here and had no effect — the sandbox still
# reported 976 MB. They are CLI flags on the build:
#
#   npx @e2b/cli template create vibe-nextjs-16 --memory-mb 4096 --cpu-count 4
#
# Defaults are 1024 MB and 2 CPUs. `--memory-mb` must be an even number.
#
# Left as a comment rather than deleted: a setting that looks present and is
# silently ignored is worth a note, or the next person adds it again.
