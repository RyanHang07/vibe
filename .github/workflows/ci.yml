name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs the postinstall `prisma generate`, which the
      # typecheck needs for the generated client types.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Last, because it is the slowest and the steps above catch more.
      #
      # Dummy values only. The build must not need real credentials — if it
      # does, something is reading a secret at module scope rather than at
      # request time, and that is worth knowing.
      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: sk-ci-placeholder
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
